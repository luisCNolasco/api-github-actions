name: Deploy Local
on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: self-hosted  # <-- importante, dice que use tu PC
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./mvnw clean package -DskipTests
      - name: Create Image
        run: docker build -t api-github-actions:latest .
      - name: Deploy
        run: docker run --name api-actions -p 8085:8080 -d api-github-actions:latest